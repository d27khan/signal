# Phase 2: naive routing — the "before" state.
# No grouping, near-zero group_wait, short repeat_interval: every firing
# alert becomes its own immediate, frequently-repeated notification.
route:
  receiver: webhook
  group_by: []
  group_wait: 0s
  group_interval: 1s
  repeat_interval: 30s

receivers:
  - name: webhook
    webhook_configs:
      - url: http://webhook-receiver:9099/webhook
        send_resolved: true
